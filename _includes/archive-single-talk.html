{% include base_path %}
{% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<article class="archive__item talk-item" itemscope itemtype="https://schema.org/Event">
  <h3 class="archive__item-title" itemprop="name">
    <a href="{{ base_path }}{{ post.url }}">{{ title }}</a>
  </h3>
  <p class="archive__item-excerpt talk-meta">
    <strong>{{ post.date | date: "%B %Y" }}</strong> · {{ post.type }} · {{ post.venue }}{% if post.location %} · {{ post.location }}{% endif %}
  </p>
  {% if post.video_url %}
    <p class="talk-links">
      <a href="{{ post.video_url }}" target="_blank" rel="noopener noreferrer">[video]</a>
    </p>
  {% endif %}
</article>
