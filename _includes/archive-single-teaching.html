{% include base_path %}
{% assign title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<article class="archive__item teaching-item" itemscope itemtype="https://schema.org/Course">
  <h3 class="archive__item-title" itemprop="name">
    <a href="{{ base_path }}{{ post.url }}">{{ title }}</a>
  </h3>
  <p class="archive__item-excerpt teaching-meta">
    <strong>{{ post.date | date: "%Y" }}</strong> · {{ post.type }} · {{ post.venue }}{% if post.event_url %} · <a href="{{ post.event_url }}" target="_blank" rel="noopener noreferrer">[school]</a>{% endif %}
  </p>
  {% if post.excerpt %}<p>{{ post.excerpt }}</p>{% endif %}
</article>
