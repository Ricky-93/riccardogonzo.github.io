<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css">
<style>html,body,#map{width:100%;height:100%;margin:0}.leaflet-container{font-size:1rem}.awesome-marker{filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}.talk-popup{font:16px/1.35 Avenir,"Helvetica Neue",Arial,sans-serif;min-width:330px}.talk-entry{padding:.15rem 0 .75rem;margin-bottom:.6rem;border-bottom:1px solid #ddd}.talk-entry:last-child{border-bottom:0;margin-bottom:0;padding-bottom:.1rem}.talk-popup b{font-size:1.03em}.talk-popup i{display:inline-block;margin:.18em 0}.talk-popup a{color:#006699;font-weight:600}.map-legend{background:rgba(255,255,255,.96);padding:8px 10px;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.3);font:12px/1.4 Avenir,"Helvetica Neue",Arial,sans-serif;color:#333}.map-legend div{margin:3px 0;white-space:nowrap}.legend-dot{display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}</style></head>
<body><div id="map"></div><script>
const locations=__PAYLOAD__;
const map=L.map("map",{center:[40.0,40.0],zoom:3,zoomControl:true,scrollWheelZoom:true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{minZoom:0,maxZoom:20,subdomains:"abcd",attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
function icon(c){return L.AwesomeMarkers.icon({markerColor:c,iconColor:"white",icon:"circle",prefix:"fa"});}
function popup(group){return '<div class="talk-popup"><b>'+group.location+'</b><br><br>'+group.events.map(e=>'<div class="talk-entry"><b>'+e.venue+'</b><br><i>'+e.title+'</i><br>'+e.date+' ('+e.type.toLowerCase()+')'+(e.video?'<br>'+e.video:'')+'</div>').join('')+'</div>';}
locations.forEach(g=>L.marker([g.lat,g.lon],{icon:icon(g.colour),riseOnHover:true,title:g.location}).addTo(map).bindPopup(popup(g),{maxWidth:500,minWidth:350,maxHeight:340}));
const legend=L.control({position:"bottomright"});legend.onAdd=function(){const d=L.DomUtil.create("div","map-legend");d.innerHTML='<div><span class="legend-dot" style="background:#a71919"></span>Invited talk</div><div><span class="legend-dot" style="background:#2a81cb"></span>Invited seminar</div><div><span class="legend-dot" style="background:#0067a3"></span>Contributed talk</div><div><span class="legend-dot" style="background:#575757"></span>Discussion session</div>';L.DomEvent.disableClickPropagation(d);return d};legend.addTo(map);
</script></body></html>
